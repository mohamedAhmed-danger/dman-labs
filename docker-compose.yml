services:
  db:
    image: mysql:8.0
    container_name: daman-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: daman-qdrant
    restart: always
    ports:
      - "6350:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - internal

  web:
    build: .
    container_name: daman-labs-agent
    restart: always
    ports:
      - "6154:4500"
    env_file:
      - .env
    volumes:
      - ./instance:/app/instance
      - ./static/uploads:/app/static/uploads
      - ./credentialss.json:/app/credentialss.json:ro
      - ./migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      waha1:
        condition: service_started
      waha2:
        condition: service_started
      waha3:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - internal

  waha1:
    image: devlikeapro/waha:latest-2026.9.2
    container_name: daman-waha1
    restart: always
    ports:
      - "3017:3000"
    environment:
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WAHA_LOG_LEVEL=warn
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WH_URL=http://web:4500/webhook/waha
      - WH_EVENTS=message.any
      - WAHA_SESSION_STORE=FILE
      - WAHA_SESSIONS_DIR=/app/.sessions
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_SESSION_CONFIG_IGNORE_STATUS=true
      - WAHA_SESSION_CONFIG_IGNORE_BROADCAST=true
      - WAHA_BASE_URL=http://waha1:3000
    volumes:
      - ./waha_sessions1:/app/.sessions
    networks:
      - internal

  waha2:
    image: devlikeapro/waha:latest-2026.9.2
    container_name: daman-waha2
    restart: always
    ports:
      - "3031:3000"
    environment:
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WAHA_LOG_LEVEL=warn
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WH_URL=http://web:4500/webhook/waha
      - WH_EVENTS=message.any
      - WAHA_SESSION_STORE=FILE
      - WAHA_SESSIONS_DIR=/app/.sessions
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_SESSION_CONFIG_IGNORE_STATUS=true
      - WAHA_SESSION_CONFIG_IGNORE_BROADCAST=true
      - WAHA_BASE_URL=http://waha2:3000
    volumes:
      - ./waha_sessions2:/app/.sessions
    networks:
      - internal

  waha3:
    image: devlikeapro/waha:latest-2026.9.2
    container_name: daman-waha3
    restart: always
    ports:
      - "3032:3000"
    environment:
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WAHA_LOG_LEVEL=warn
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WH_URL=http://web:4500/webhook/waha
      - WH_EVENTS=message.any
      - WAHA_SESSION_STORE=FILE
      - WAHA_SESSIONS_DIR=/app/.sessions
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_SESSION_CONFIG_IGNORE_STATUS=true
      - WAHA_SESSION_CONFIG_IGNORE_BROADCAST=true
      - WAHA_BASE_URL=http://waha3:3000
    volumes:
      - ./waha_sessions3:/app/.sessions
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: daman-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - internal

  redis_worker:
    build: .
    container_name: daman-redis-worker
    restart: always
    command: ["python", "-m", "services.messaging.redis_worker"]
    env_file:
      - .env
    volumes:
      - ./instance:/app/instance
      - ./static/uploads:/app/static/uploads
      - ./credentialss.json:/app/credentialss.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mysqldata:
  qdrantdata:
  redisdata: